version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    # Only raise a lower bound when the current range excludes a new release,
    # so `>=` floors keep supporting Python 3.10-3.13.
    versioning-strategy: increase-if-necessary
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: build

  - package-ecosystem: npm
    directory: /prototype/docs
    schedule:
      interval: weekly
    groups:
      node:
        patterns: ["*"]
    commit-message:
      prefix: build
