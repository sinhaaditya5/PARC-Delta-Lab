name: Bug report
description: Something in the code or pipeline does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Please fill in as much as you can.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - parc-delta (research package)
        - prototype/sim (magnet, orbits, bench physics)
        - prototype/cad or drawings
        - prototype/renders, diagrams or video
        - prototype/report or docs (docx / pptx)
        - Makefile, scripts or CI
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the command you ran and the full error output.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make install
        2. make sims
        3. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS 15 / Ubuntu 24.04, Python 3.12, commit abc1234"
    validations:
      required: true
