name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the package to"
        required: true

permissions:
  contents: write

jobs:
  package:
    name: Build and attach parc-delta distribution
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify release integrity
        run: ./scripts/verify_integrity.sh
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build parc-delta --outdir dist
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
